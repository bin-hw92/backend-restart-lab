<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NestJS 게시판 실습</title>
  <style>
    body { max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; color: #182230; background: #f5f7fa; }
    h1 { font-size: 26px; } h2 { font-size: 20px; }
    section { background: white; border: 1px solid #dce2ea; border-radius: 12px; padding: 20px; margin: 20px 0; }
    label { display: block; margin: 12px 0; } input, textarea { box-sizing: border-box; width: 100%; padding: 9px; margin-top: 5px; font: inherit; border: 1px solid #aab6c5; border-radius: 5px; }
    button { padding: 8px 12px; margin: 3px 5px 3px 0; cursor: pointer; font: inherit; }
    button:disabled { cursor: default; opacity: .5; }
    ul { list-style: none; padding: 0; } li { border-bottom: 1px solid #e5e9ef; padding: 8px 0; }
    li button { background: none; border: 0; text-align: left; color: #174da6; }
    #message { min-height: 24px; white-space: pre-wrap; } #detail-content { white-space: pre-wrap; overflow-wrap: anywhere; }
    #detail-title { overflow-wrap: anywhere; } small { color: #54657a; }
  </style>
</head>
<body>
  <h1>NestJS 게시판 실습</h1>
  <p>글을 저장하고, 서버 코드가 DB까지 연결되는 흐름을 따라가 보세요.</p>
  <p id="message" role="status" aria-live="polite"></p>
  <section>
    <h2>게시글 목록</h2>
    <form id="search-form">
      <label>제목·본문 검색 <input id="query" maxlength="100"></label>
      <button>검색</button>
    </form>
    <ul id="list"></ul>
    <button id="prev" type="button">이전</button>
    <span id="page"></span>
    <button id="next" type="button">다음</button>
  </section>
  <section id="detail" hidden>
    <h2 id="detail-title"></h2>
    <small id="detail-meta"></small>
    <p id="detail-content"></p>
    <button id="edit" type="button">수정하기</button>
    <button id="delete" type="button">삭제하기</button>
  </section>
  <section>
    <h2 id="form-title">새 글 쓰기</h2>
    <form id="post-form">
      <label>제목 <input id="title" required maxlength="100"></label>
      <label>작성자 <input id="author" required maxlength="40"></label>
      <label>본문 <textarea id="content" required maxlength="10000" rows="5"></textarea></label>
      <button id="save">저장</button>
      <button id="cancel" type="button">새 글로 전환</button>
    </form>
  </section>
  <script>
    const el = id => document.getElementById(id);
    let page = 1;
    let query = '';
    let selected = null;
    let editingId = null;

    async function api(path, method = 'GET', body) {
      const response = await fetch('/api/posts' + path, {
        method,
        headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      if (response.status === 204) return null;
      const data = await response.json();
      if (!response.ok) throw new Error(Array.isArray(data.message) ? data.message.join('\n') : data.message);
      return data;
    }

    async function load() {
      const data = await api(`?page=${page}&limit=5&q=${encodeURIComponent(query)}`);
      el('list').replaceChildren();
      for (const post of data.items) {
        const item = document.createElement('li');
        const button = document.createElement('button');
        // 게시글을 HTML로 해석하지 않고 글자로 표시합니다.
        button.textContent = `${post.title} · ${post.author}`;
        button.onclick = () => show(post.id).catch(showError);
        item.append(button);
        el('list').append(item);
      }
      if (!data.items.length) el('list').textContent = '게시글이 없습니다.';
      el('page').textContent = `${page}쪽 · 전체 ${data.total}개`;
      el('prev').disabled = page === 1;
      el('next').disabled = page * 5 >= data.total;
    }

    async function show(id) {
      selected = await api('/' + id);
      el('detail-title').textContent = selected.title;
      el('detail-content').textContent = selected.content;
      // API의 UTC 날짜를 사용자의 브라우저 시간대로 표시합니다.
      el('detail-meta').textContent = `${selected.author} · ${new Date(selected.createdAt).toLocaleString()}`;
      el('detail').hidden = false;
    }

    function resetForm() {
      editingId = null;
      el('post-form').reset();
      el('form-title').textContent = '새 글 쓰기';
    }

    function showError(error) { el('message').textContent = error.message; }

    el('post-form').onsubmit = async event => {
      event.preventDefault();
      el('save').disabled = true;
      try {
        const body = { title: el('title').value, content: el('content').value, author: el('author').value };
        const post = await api(editingId ? '/' + editingId : '', editingId ? 'PATCH' : 'POST', body);
        resetForm();
        page = 1;
        await load();
        await show(post.id);
        el('message').textContent = '저장했습니다.';
      } catch (error) { showError(error); }
      finally { el('save').disabled = false; }
    };
    el('search-form').onsubmit = event => {
      event.preventDefault(); query = el('query').value.trim(); page = 1; load().catch(showError);
    };
    el('prev').onclick = () => { page--; load().catch(showError); };
    el('next').onclick = () => { page++; load().catch(showError); };
    el('edit').onclick = () => {
      editingId = selected.id;
      for (const key of ['title', 'content', 'author']) el(key).value = selected[key];
      el('form-title').textContent = '게시글 수정';
      el('title').focus();
    };
    el('delete').onclick = async () => {
      if (!confirm('이 게시글을 삭제할까요?')) return;
      try {
        await api('/' + selected.id, 'DELETE');
        el('detail').hidden = true; selected = null; resetForm(); page = 1;
        await load(); el('message').textContent = '삭제했습니다.';
      } catch (error) { showError(error); }
    };
    el('cancel').onclick = resetForm;
    load().catch(showError);
  </script>
</body>
</html>
